# The Fragments section of the Elsewhere page.
# Photos appear in this order. The first runs full width; the numbers and the two columns follow from the order.
# A photo with no place shows none. After adding a photo or changing a source, run: python3 scripts/build_photos.py

intro: "A few little moments from walks, hikes, and travels.\u00A0📸"

photos:
  - id: grand-canyon
    source: grand canyon.jpg
    title: Spring
    place: Grand Canyon
    alt: The Colorado River winding between the layered red walls of the Grand Canyon at dusk.

  - id: peace
    source: peace.jpeg
    title: Summer
    place: Lee Ufan Museum
    alt: A tall concrete arch on a grassy field by the sea at the Lee Ufan Museum, with one small figure in the distance.

  - id: aomori-autumn
    source: autumn in Aomori.jpeg
    title: Autumn
    place: Aomori
    alt: A hillside of red and orange autumn trees in Aomori, reflected in a still lake.

  - id: lake-michigan
    source: Michigan lake.jpg
    title: Winter
    place: Chicago
    alt: Eight geese swimming in a line across the calm, pale blue water of Lake Michigan in Chicago.

  - id: tokyo-station
    source: Tokyo station.jpg
    title: Tokyo Station
    place:
    alt: The red-brick Marunouchi building of Tokyo Station, with white stone bands, pine trees and two flagpoles in front, and glass towers behind.

  - id: parking-only
    source: parking only2.JPG
    title: "Parking only :)"
    place: San Francisco
    alt: A seagull standing on top of a blue accessible-parking sign in San Francisco, under a wide blue sky with the sea on the horizon.

  - id: hokkaido-lighthouse
    source: lighthouse in Hokkaido.jpeg
    title: Lighthouse
    place: Abashiri
    alt: A black-and-white striped lighthouse in Abashiri, its lamp lit under a dark blue evening sky.

  - id: fuji-summit
    source: Fuji top.jpg
    title: "12 hours of hiking for a giant hole\u00A0😴"
    place: Mt. Fuji summit
    alt: The rust-red crater at the summit of Mt. Fuji, strewn with rocks, under a blue sky with thin clouds.

  - id: hello
    source: Hello.jpeg
    title: Hello
    place: Gotoku-ji Temple
    alt: Rows of white beckoning-cat figurines at Gotoku-ji Temple, with red ears and collars, each raising one paw.

  - id: baby-girl
    source: baby girl grows up.jpg
    title: "My baby girl grows up\u00A0❤️"
    place:
    alt: A small tan dog in a white fleece costume, standing on a gray wood floor and looking down.
